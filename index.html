                    <rect y="210" width="740" height="30"/>

                </g>
                <rect width="296" height="210" fill="#002868"/>

            <div class="resource-links" id="modalLinks"></div>
            <button class="close-modal" onclick="closeStateModal()">Close Portal</button>

        function openStateModal(title, detail, description, imageUrl, citation, wikidataUrl, isHistory = false) {
            document.getElementById('modalStateName').innerText = title;
            document.getElementById('modalCapitalName').innerText = detail;
            document.getElementById('modalDescription').innerText = description || "";
            
            const imgContainer = document.getElementById('modalImgContainer');
            const modalImg = document.getElementById('modalImage');
            if (imageUrl) {
                modalImg.src = imageUrl;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.style.display = 'none';
            }

            const citationEl = document.getElementById('modalCitation');
            if (citation) {
                citationEl.innerText = citation;
                citationEl.style.display = 'block';
            } else {
                citationEl.style.display = 'none';
            }

            const linksContainer = document.getElementById('modalLinks');
            
            if (isHistory) {
                linksContainer.innerHTML = `
                    <a class="resource-btn" href="${wikidataUrl}" target="_blank"><span>Wikidata Record</span> &rarr;</a>
                    <a class="resource-btn" href="https://www.loc.gov" target="_blank"><span>Library of Congress Archives</span> &rarr;</a>
                `;
            } else {
                const stateSlug = title.toLowerCase().replace(/\s+/g, '');
                linksContainer.innerHTML = `
                    <a class="resource-btn" href="https://www.${stateSlug}.gov" target="_blank"><span>Official State Portal</span> &rarr;</a>
                    <a class="resource-btn" href="https://www.usa.gov/state-swm" target="_blank"><span>Citizen Benefits</span> &rarr;</a>
                    <a class="resource-btn" href="https://www.vote.org" target="_blank"><span>Voter Registration</span> &rarr;</a>
                `;
            }

            document.getElementById('stateModal').classList.add('active');
        }

        function closeStateModal() {
            document.getElementById('stateModal').classList.remove('active');
        }

        const vectorSource = new ol.source.Vector();

        // Add State Capitals (Gold Stars)
        Object.keys(stateCapitalData).forEach(stateName => {
            const coords = capitalCoords[stateName];
            if (coords) {
                const feature = new ol.Feature({
                    geometry: new ol.geom.Point(ol.proj.fromLonLat(coords)),
                    title: stateName,
                    detail: `Capital: ${stateCapitalData[stateName]}`,
                    isHistory: false
                });

                feature.setStyle(new ol.style.Style({
                    image: new ol.style.Icon({
                        anchor: [0.5, 0.5],
                        anchorXUnits: 'fraction',
                        anchorYUnits: 'fraction',
                        src: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="%23F59E0B" stroke="%23FFFFFF" stroke-width="0.5"/></svg>',
                        scale: 1.0
                    })
                }));

                vectorSource.addFeature(feature);
            }
        });

        // Add Historical Event Markers with Public Domain Image Support
        historicalEvents.forEach(evt => {
            const isWhiteHouse = evt.name.includes("White House");
            
            const feature = new ol.Feature({
                geometry: new ol.geom.Point(ol.proj.fromLonLat(evt.coords)),
                title: evt.name,
                detail: `Historical Landmark (${evt.year})`,
                description: evt.description,
                imageUrl: evt.imageUrl,
                citation: evt.citation,
                wikidataUrl: evt.wikidata,
                isHistory: true
            });

            const iconSvg = isWhiteHouse 
                ? 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="36" height="36"><circle cx="16" cy="16" r="15" fill="%231D4ED8" stroke="%23FFFFFF" stroke-width="2"/><path d="M16 6l7 4v2H9v-2l7-4zm-6 8h12v1H10v-1zm1 2h10v10H11v-10zm2 2v6h2v-6h-2zm4 0v6h2v-6h-2z" fill="%23FFFFFF"/></svg>'
                : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30"><circle cx="12" cy="12" r="11" fill="%231D4ED8" stroke="%23FFFFFF" stroke-width="1.5"/><path d="M12 3l5 3v1H7V6l5-3zm-5 6h10v1H7V9zm1 2h8v7H8v-7zm1 1v5h2v-5H9zm4 0v5h2v-5h-2z" fill="%23FFFFFF"/></svg>';

            feature.setStyle(new ol.style.Style({
                image: new ol.style.Icon({
                    anchor: [0.5, 0.5],
                    anchorXUnits: 'fraction',
                    anchorYUnits: 'fraction',
                    src: iconSvg,
                    scale: isWhiteHouse ? 1.3 : 1.2
                })
            }));

            vectorSource.addFeature(feature);
        });

        const vectorLayer = new ol.layer.Vector({
            source: vectorSource
        });

        const map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM()
                }),
                vectorLayer
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([-96.0, 37.8]),
                zoom: 4,
                minZoom: 3,
                maxZoom: 10
            }),
            controls: []
        });

        map.on('click', (event) => {
            const feature = map.forEachFeatureAtPixel(event.pixel, (feat) => feat);
            if (feature) {
                const title = feature.get('title');
                const detail = feature.get('detail');
                const description = feature.get('description');
                const imageUrl = feature.get('imageUrl');
                const citation = feature.get('citation');
                const wikidataUrl = feature.get('wikidataUrl');
                const isHistory = feature.get('isHistory');
                if (title) openStateModal(title, detail, description, imageUrl, citation, wikidataUrl, isHistory);
            }
        });

        map.on('pointermove', (event) => {
            const hit = map.hasFeatureAtPixel(event.pixel);
            map.getTargetElement().style.cursor = hit ? 'pointer' : '';
        });

        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });

        const particles = [];
        for (let i = 0; i < 200; i++) {
            particles.push({
                x: (Math.random() - 0.5) * width * 2,
                y: (Math.random() - 0.5) * height * 2,
                z: Math.random() * 800 - 400,
                vx: (Math.random() - 0.5) * 0.08,
                vy: (Math.random() - 0.5) * 0.08,
                vz: (Math.random() - 0.5) * 0.15,
                size: Math.random() * 1.5 + 0.5
            });
        }

        function render() {
            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.z += p.vz;
                if (p.z < -400) p.z = 400;
                if (p.z > 400) p.z = -400;

                const fov = 450;
                const scale = fov / (fov + p.z);
                const px = width / 2 + p.x * scale;
                const py = height / 2 + p.y * scale;

                if (px >= 0 && px <= width && py >= 0 && py <= height) {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0.1, (p.z + 400) / 800) * 0.45;
                    ctx.fillStyle = '#F59E0B';
                    ctx.beginPath();
                    ctx.arc(px, py, p.size * scale, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
