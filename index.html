<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American Citizen Portal</title>
    <link rel="stylesheet" href="assets/style.css">
    <!-- Leaflet CSS for OpenStreetMap integration -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
    <div id="canvas-container">
        <canvas id="engineCanvas"></canvas>
    </div>

    <!-- Leaflet Map Container -->
    <div id="map"></div>

    <div class="state-modal" id="stateModal">
        <h2 id="modalStateName">State</h2>
        <h3 id="modalCapitalName">Capital</h3>
        <div class="resource-links" id="modalLinks"></div>
        <button class="close-modal" onclick="closeStateModal()">Close</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        const stateCapitalData = {
            "Alabama": "Montgomery", "Alaska": "Juneau", "Arizona": "Phoenix", "Arkansas": "Little Rock",
            "California": "Sacramento", "Colorado": "Denver", "Connecticut": "Hartford", "Delaware": "Dover",
            "Florida": "Tallahassee", "Georgia": "Atlanta", "Hawaii": "Honolulu", "Idaho": "Boise",
            "Illinois": "Springfield", "Indiana": "Indianapolis", "Iowa": "Des Moines", "Kansas": "Topeka",
            "Kentucky": "Frankfort", "Louisiana": "Baton Rouge", "Maine": "Augusta", "Maryland": "Annapolis",
            "Massachusetts": "Boston", "Michigan": "Lansing", "Minnesota": "Saint Paul", "Mississippi": "Jackson",
            "Missouri": "Jefferson City", "Montana": "Helena", "Nebraska": "Lincoln", "Nevada": "Carson City",
            "New Hampshire": "Concord", "New Jersey": "Trenton", "New Mexico": "Santa Fe", "New York": "Albany",
            "North Carolina": "Raleigh", "North Dakota": "Bismarck", "Ohio": "Columbus", "Oklahoma": "Oklahoma City",
            "Oregon": "Salem", "Pennsylvania": "Harrisburg", "Rhode Island": "Providence", "South Carolina": "Columbia",
            "South Dakota": "Pierre", "Tennessee": "Nashville", "Texas": "Austin", "Utah": "Salt Lake City",
            "Vermont": "Montpelier", "Virginia": "Richmond", "Washington": "Olympia", "West Virginia": "Charleston",
            "Wisconsin": "Madison", "Wyoming": "Cheyenne"
        };

        const capitalCoords = {
            "Alabama": [32.3668, -86.3007], "Alaska": [58.3019, -134.4197], "Arizona": [33.4484, -112.0740],
            "Arkansas": [34.7465, -92.2896], "California": [38.5816, -121.4944], "Colorado": [39.7392, -104.9903],
            "Connecticut": [41.7658, -72.6734], "Delaware": [39.1582, -75.5267], "Florida": [30.4383, -84.2807],
            "Georgia": [33.7490, -84.3880], "Hawaii": [21.3069, -157.8583], "Idaho": [43.6150, -116.2023],
            "Illinois": [39.7817, -89.6501], "Indiana": [39.7684, -86.1581], "Iowa": [41.5868, -93.6091],
            "Kansas": [39.0473, -95.6845], "Kentucky": [38.2009, -84.8753], "Louisiana": [30.4515, -91.1403],
            "Maine": [44.3106, -69.7876], "Maryland": [38.9784, -76.5011], "Massachusetts": [42.3601, -71.0589],
            "Michigan": [42.7325, -84.5555], "Minnesota": [44.9537, -93.0899], "Mississippi": [32.2988, -90.1848],
            "Missouri": [38.5767, -92.1735], "Montana": [46.5891, -112.0391], "Nebraska": [40.8136, -96.7026],
            "Nevada": [39.1638, -119.7674], "New Hampshire": [43.2081, -71.5376], "New Jersey": [40.2206, -74.7597],
            "New Mexico": [35.6870, -105.9378], "New York": [42.6526, -73.7562], "North Carolina": [35.7796, -78.6382],
            "North Dakota": [46.8083, -100.7790], "Ohio": [39.9612, -82.9988], "Oklahoma": [35.4676, -97.5164],
            "Oregon": [44.9429, -123.0351], "Pennsylvania": [40.2732, -76.8867], "Rhode Island": [41.8240, -71.4128],
            "South Carolina": [34.0007, -81.0348], "South Dakota": [44.3683, -100.3538], "Tennessee": [36.1627, -86.7816],
            "Texas": [30.2672, -97.7431], "Utah": [40.7608, -111.8910], "Vermont": [44.2601, -72.5754],
            "Virginia": [37.5407, -77.4601], "Washington": [47.0379, -122.9007], "West Virginia": [38.3498, -81.6326],
            "Wisconsin": [43.0731, -89.4012], "Wyoming": [41.1400, -104.8202]
        };

        function openStateModal(stateName) {
            const capital = stateCapitalData[stateName];
            document.getElementById('modalStateName').innerText = stateName;
            document.getElementById('modalCapitalName').innerText = `Capital: ${capital}`;
            
            const linksContainer = document.getElementById('modalLinks');
            const stateSlug = stateName.toLowerCase().replace(/\s+/g, '');
            
            linksContainer.innerHTML = `
                <a class="resource-btn" href="https://www.${stateSlug}.gov" target="_blank"><span>Official State Portal</span> &rarr;</a>
                <a class="resource-btn" href="https://www.usa.gov/state-swm" target="_blank"><span>Citizen Benefits</span> &rarr;</a>
                <a class="resource-btn" href="https://www.vote.org" target="_blank"><span>Voter Registration</span> &rarr;</a>
            `;

            document.getElementById('stateModal').classList.add('active');
        }

        function closeStateModal() {
            document.getElementById('stateModal').classList.remove('active');
        }

        // Initialize Leaflet map with dark tile layer (CartoDB Dark Matter / OpenStreetMap ecosystem)
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([37.8, -96], 4);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 10,
            minZoom: 3,
            subdomains: 'abcd'
        }).addTo(map);

        // Add custom star markers for each state capital
        Object.keys(stateCapitalData).forEach(stateName => {
            const coords = capitalCoords[stateName];
            if (coords) {
                const starIcon = L.divIcon({
                    className: 'custom-star-icon',
                    html: `<svg viewBox="0 0 24 24" class="leaflet-star-svg"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });

                const marker = L.marker(coords, { icon: starIcon }).addTo(map);
                marker.on('click', () => openStateModal(stateName));
            }
        });

        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });

        const particles = [];
        for (let i = 0; i < 200; i++) {
            particles.push({
                x: (Math.random() - 0.5) * width * 2,
                y: (Math.random() - 0.5) * height * 2,
                z: Math.random() * 800 - 400,
                vx: (Math.random() - 0.5) * 0.08,
                vy: (Math.random() - 0.5) * 0.08,
                vz: (Math.random() - 0.5) * 0.15,
                size: Math.random() * 1.5 + 0.5
            });
        }

        function render() {
            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.z += p.vz;
                if (p.z < -400) p.z = 400;
                if (p.z > 400) p.z = -400;

                const fov = 450;
                const scale = fov / (fov + p.z);
                const px = width / 2 + p.x * scale;
                const py = height / 2 + p.y * scale;

                if (px >= 0 && px <= width && py >= 0 && py <= height) {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0.1, (p.z + 400) / 800) * 0.35;
                    ctx.fillStyle = '#F59E0B';
                    ctx.beginPath();
                    ctx.arc(px, py, p.size * scale, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
