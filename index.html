<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American Citizen Portal | Public Notice & Knowledge Base</title>
    
    <!-- SEO & Metadata Optimization -->
    <meta name="description" content="Public citizen portal and knowledge base providing geographic data, state capital registries, and civic resources. Created and maintained by Jesse Bautista III.">
    <meta name="author" content="Jesse Bautista III">
    <link rel="canonical" href="https://notice.jessebautistaiii.com">

    <!-- Open Graph / Social SEO -->
    <meta property="og:title" content="American Citizen Portal | Public Notice">
    <meta property="og:description" content="Public knowledge base and interactive geographic registry of US state capitals.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://notice.jessebautistaiii.com">
    <meta property="og:site_name" content="American Citizen Portal">

    <!-- Dublin Core Metadata -->
    <meta name="DC.title" content="American Citizen Portal">
    <meta name="DC.creator" content="Jesse Bautista III">
    <meta name="DC.publisher" content="Jesse Bautista III">
    <meta name="DC.type" content="Interactive Resource">
    <meta name="DC.format" content="text/html">
    <meta name="DC.language" content="en">

    <!-- JSON-LD Structured Data (Schema.org & Wikidata Integration) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "American Citizen Portal",
      "url": "https://notice.jessebautistaiii.com",
      "author": {
        "@type": "Person",
        "name": "Jesse Bautista III",
        "url": "https://jessebautistaiii.com"
      },
      "about": [
        {
          "@type": "Thing",
          "name": "United States State Capitals",
          "sameAs": "https://www.wikidata.org/wiki/Q35472"
        },
        {
          "@type": "Thing",
          "name": "Public Notice",
          "sameAs": "https://www.wikidata.org/wiki/Q7257917"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="assets/style.css">
    <!-- OpenLayers (Open Maps) CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css">
</head>
<body>
    <div id="canvas-container">
        <canvas id="engineCanvas"></canvas>
    </div>

    <!-- Semi-Transparent OpenLayers Map Container -->
    <div id="map" class="map"></div>

    <header class="site-header">
        <h1>American Citizen Portal</h1>
        <p>Public Knowledge Registry &mdash; Maintained by <a href="https://jessebautistaiii.com" target="_blank" rel="author">Jesse Bautista III</a></p>
    </header>

    <div class="state-modal" id="stateModal">
        <h2 id="modalStateName">State</h2>
        <h3 id="modalCapitalName">Capital</h3>
        <div class="resource-links" id="modalLinks"></div>
        <button class="close-modal" onclick="closeStateModal()">Close</button>
    </div>

    <!-- OpenLayers (Open Maps) JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.js"></script>

    <script>
        const stateCapitalData = {
            "Alabama": "Montgomery", "Alaska": "Juneau", "Arizona": "Phoenix", "Arkansas": "Little Rock",
            "California": "Sacramento", "Colorado": "Denver", "Connecticut": "Hartford", "Delaware": "Dover",
            "Florida": "Tallahassee", "Georgia": "Atlanta", "Hawaii": "Honolulu", "Idaho": "Boise",
            "Illinois": "Springfield", "Indiana": "Indianapolis", "Iowa": "Des Moines", "Kansas": "Topeka",
            "Kentucky": "Frankfort", "Louisiana": "Baton Rouge", "Maine": "Augusta", "Maryland": "Annapolis",
            "Massachusetts": "Boston", "Michigan": "Lansing", "Minnesota": "Saint Paul", "Mississippi": "Jackson",
            "Missouri": "Jefferson City", "Montana": "Helena", "Nebraska": "Lincoln", "Nevada": "Carson City",
            "New Hampshire": "Concord", "New Jersey": "Trenton", "New Mexico": "Santa Fe", "New York": "Albany",
            "North Carolina": "Raleigh", "North Dakota": "Bismarck", "Ohio": "Columbus", "Oklahoma": "Oklahoma City",
            "Oregon": "Salem", "Pennsylvania": "Harrisburg", "Rhode Island": "Providence", "South Carolina": "Columbia",
            "South Dakota": "Pierre", "Tennessee": "Nashville", "Texas": "Austin", "Utah": "Salt Lake City",
            "Vermont": "Montpelier", "Virginia": "Richmond", "Washington": "Olympia", "West Virginia": "Charleston",
            "Wisconsin": "Madison", "Wyoming": "Cheyenne"
        };

        const capitalCoords = {
            "Alabama": [-86.3007, 32.3668], "Alaska": [-134.4197, 58.3019], "Arizona": [-112.0740, 33.4484],
            "Arkansas": [-92.2896, 34.7465], "California": [-121.4944, 38.5816], "Colorado": [-104.9903, 39.7392],
            "Connecticut": [-72.6734, 41.7658], "Delaware": [-75.5267, 39.1582], "Florida": [-84.2807, 30.4383],
            "Georgia": [-84.3880, 33.7490], "Hawaii": [-157.8583, 21.3069], "Idaho": [-116.2023, 43.6150],
            "Illinois": [-89.6501, 39.7817], "Indiana": [-86.1581, 39.7684], "Iowa": [-93.6091, 41.5868],
            "Kansas": [-95.6845, 39.0473], "Kentucky": [-84.8753, 38.2009], "Louisiana": [-91.1403, 30.4515],
            "Maine": [-69.7876, 44.3106], "Maryland": [-76.5011, 38.9784], "Massachusetts": [-71.0589, 42.3601],
            "Michigan": [-84.5555, 42.7325], "Minnesota": [-93.0899, 44.9537], "Mississippi": [-90.1848, 32.2988],
            "Missouri": [-92.1735, 38.5767], "Montana": [-112.0391, 46.5891], "Nebraska": [-96.7026, 40.8136],
            "Nevada": [-119.7674, 39.1638], "New Hampshire": [-71.5376, 43.2081], "New Jersey": [-74.7597, 40.2206],
            "New Mexico": [-105.9378, 35.6870], "New York": [-73.7562, 42.6526], "North Carolina": [-78.6382, 35.7796],
            "North Dakota": [-100.7790, 46.8083], "Ohio": [-82.9988, 39.9612], "Oklahoma": [-97.5164, 35.4676],
            "Oregon": [-123.0351, 44.9429], "Pennsylvania": [-76.8867, 40.2732], "Rhode Island": [-71.4128, 41.8240],
            "South Carolina": [-81.0348, 34.0007], "South Dakota": [-100.3538, 44.3683], "Tennessee": [-86.7816, 36.1627],
            "Texas": [-97.7431, 30.2672], "Utah": [-111.8910, 40.7608], "Vermont": [-72.5754, 44.2601],
            "Virginia": [-77.4601, 37.5407], "Washington": [-122.9007, 47.0379], "West Virginia": [-81.6326, 38.3498],
            "Wisconsin": [-89.4012, 43.0731], "Wyoming": [-104.8202, 41.1400]
        };

        function openStateModal(stateName) {
            const capital = stateCapitalData[stateName];
            document.getElementById('modalStateName').innerText = stateName;
            document.getElementById('modalCapitalName').innerText = `Capital: ${capital}`;
            
            const linksContainer = document.getElementById('modalLinks');
            const stateSlug = stateName.toLowerCase().replace(/\s+/g, '');
            
            linksContainer.innerHTML = `
                <a class="resource-btn" href="https://www.${stateSlug}.gov" target="_blank"><span>Official State Portal</span> &rarr;</a>
                <a class="resource-btn" href="https://www.usa.gov/state-swm" target="_blank"><span>Citizen Benefits</span> &rarr;</a>
                <a class="resource-btn" href="https://www.vote.org" target="_blank"><span>Voter Registration</span> &rarr;</a>
            `;

            document.getElementById('stateModal').classList.add('active');
        }

        function closeStateModal() {
            document.getElementById('stateModal').classList.remove('active');
        }

        const vectorSource = new ol.source.Vector();

        Object.keys(stateCapitalData).forEach(stateName => {
            const coords = capitalCoords[stateName];
            if (coords) {
                const feature = new ol.Feature({
                    geometry: new ol.geom.Point(ol.proj.fromLonLat(coords)),
                    stateName: stateName,
                    capitalName: stateCapitalData[stateName]
                });

                feature.setStyle(new ol.style.Style({
                    image: new ol.style.Icon({
                        anchor: [0.5, 0.5],
                        anchorXUnits: 'fraction',
                        anchorYUnits: 'fraction',
                        src: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="%23F59E0B" stroke="%23FFFFFF" stroke-width="0.5"/></svg>',
                        scale: 1.0
                    })
                }));

                vectorSource.addFeature(feature);
            }
        });

        const vectorLayer = new ol.layer.Vector({
            source: vectorSource
        });

        // Initialize OpenLayers Map with standard OpenStreetMap raster tiles (showing terrain, labels, geography)
        const map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM()
                }),
                vectorLayer
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([-96.0, 37.8]),
                zoom: 4,
                minZoom: 3,
                maxZoom: 10
            }),
            controls: []
        });

        map.on('click', (event) => {
            const feature = map.forEachFeatureAtPixel(event.pixel, (feat) => feat);
            if (feature) {
                const stateName = feature.get('stateName');
                if (stateName) openStateModal(stateName);
            }
        });

        map.on('pointermove', (event) => {
            const hit = map.hasFeatureAtPixel(event.pixel);
            map.getTargetElement().style.cursor = hit ? 'pointer' : '';
        });

        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });

        const particles = [];
        for (let i = 0; i < 200; i++) {
            particles.push({
                x: (Math.random() - 0.5) * width * 2,
                y: (Math.random() - 0.5) * height * 2,
                z: Math.random() * 800 - 400,
                vx: (Math.random() - 0.5) * 0.08,
                vy: (Math.random() - 0.5) * 0.08,
                vz: (Math.random() - 0.5) * 0.15,
                size: Math.random() * 1.5 + 0.5
            });
        }

        function render() {
            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.z += p.vz;
                if (p.z < -400) p.z = 400;
                if (p.z > 400) p.z = -400;

                const fov = 450;
                const scale = fov / (fov + p.z);
                const px = width / 2 + p.x * scale;
                const py = height / 2 + p.y * scale;

                if (px >= 0 && px <= width && py >= 0 && py <= height) {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0.1, (p.z + 400) / 800) * 0.45;
                    ctx.fillStyle = '#F59E0B';
                    ctx.beginPath();
                    ctx.arc(px, py, p.size * scale, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
